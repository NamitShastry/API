services:
  # ============================================================
  # PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeroindex
      POSTGRES_USER: aeroindex
      POSTGRES_PASSWORD: changeme_pg_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroindex"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # MinIO (S3-compatible object storage)
  # ============================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme_minio_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Backend API (FastAPI)
  # ============================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - DATABASE_URL_SYNC=postgresql://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=changeme_minio_dev_only
      - MINIO_BUCKET=aeroindex-raw
      - DATA_MODE=SIMULATED_LIVE
      - SIM_SEED=20260922
      - SIMULATION_INTERVAL_SECONDS=2
      - JWT_SECRET_KEY=dev-only-secret-change-in-production-please
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - API_CORS_ORIGINS=http://localhost:3000
      - TZ=Asia/Kolkata
      - HEARTBEAT_INTERVAL_SECONDS=10
      - FRESHNESS_FRESH_SECONDS=30
      - FRESHNESS_DEGRADED_SECONDS=120
      - FRESHNESS_STALE_SECONDS=300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python -m app.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ============================================================
  # Celery Worker (background tasks)
  # ============================================================
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - DATABASE_URL_SYNC=postgresql://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=changeme_minio_dev_only
      - DATA_MODE=SIMULATED_LIVE
      - SIM_SEED=20260922
      - SIMULATION_INTERVAL_SECONDS=2
      - TZ=Asia/Kolkata
      - HEARTBEAT_INTERVAL_SECONDS=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q default,collection,cleaning,indexing

  # ============================================================
  # Scheduler (APScheduler + continuous simulator)
  # ============================================================
  scheduler:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - DATABASE_URL_SYNC=postgresql://aeroindex:changeme_pg_dev_only@postgres:5432/aeroindex
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATA_MODE=SIMULATED_LIVE
      - SIM_SEED=20260922
      - SIMULATION_INTERVAL_SECONDS=2
      - TZ=Asia/Kolkata
      - HEARTBEAT_INTERVAL_SECONDS=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    command: python -m app.scheduler

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_APP_NAME=AeroIndex
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  pgdata:
  redisdata:
  miniodata:
